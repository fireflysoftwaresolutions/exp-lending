        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApplicationDocumentDTO"
    post:
      tags:
      - Lending - Application Documents
      summary: Upload actual application evidence and attach its retained owner reference
      description: Requires the caller's original action and actual base64 content.
        Party comes only from the signed current HUMAN identity. documentId remains
        the legacy association identifier; storedDocumentId is the distinct Document
        owner identity. Evidence verification remains PENDING.
      operationId: uploadDocument
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadDocumentCommand"
        required: true
      responses:
        "201":
          description: Actual custody and original association observed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationDocumentDTO"
        "200":
          description: Same original action/content replayed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationDocumentDTO"
        "400":
          description: Missing action/content or invalid route/filename/type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationDocumentDTO"
        "413":
          description: JSON envelope exceeds3145728bytes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationDocumentDTO"
        "401":
          description: Bearer authentication refused
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationDocumentDTO"
        "403":
          description: Current original signed-party authority refused
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationDocumentDTO"
        "409":
          description: Original action has different evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationEvidenceError"
        "503":
          description: Known owner progress retained or completion uncertain; recover
            only the same original action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationEvidenceError"
      security:
      - lendingExperienceIntakeBearer: []
      x-disable-idempotency: true
