  /api/v1/experience/lending/simulations/configure:
    post:
      tags:
      - Lending - Simulation & Eligibility
      summary: Configure Simulation
      description: Validates configuration and returns LENDING_TERMS_UNAVAILABLE until
        exact verified product terms are available. No calculation is persisted.
      operationId: configureLendingSimulation
      parameters:
      - name: X-Idempotency-Key
        in: header
        description: Accepted for SDK compatibility and ignored. Current verified
          owner terms are required for simulation availability.
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfigureSimulationCommand"
        required: true
      responses:
        "201":
          description: Historical success schema retained for compatible clients
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfiguredSimulationDTO"
        "400":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfiguredSimulationDTO"
        "503":
          description: LENDING_TERMS_UNAVAILABLE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      x-disable-idempotency: true
  /api/v1/experience/lending/simulations:
    post:
      tags:
