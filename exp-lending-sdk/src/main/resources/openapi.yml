      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: partyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: X-Idempotency-Key
        in: header
        description: "Optional retry key for scoped POST, PUT, PATCH, and DELETE response\
