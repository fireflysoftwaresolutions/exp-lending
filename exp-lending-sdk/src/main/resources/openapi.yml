openapi: 3.0.1
info:
  title: OpenAPI definition
  version: v0
servers:
- url: http://localhost:18080
  description: Generated server url
tags:
- name: Personal Loans
  description: Personal loan agreement management
paths:
  /api/v1/experience/lending/personal-loans/{agreementId}:
    get:
      tags:
      - Personal Loans
      summary: Get Personal Loan Agreement
      description: Returns full details of a single personal loan agreement.
      operationId: getAgreement
      parameters:
      - name: agreementId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: X-Idempotency-Key
        in: header
        description: "Optional retry key for scoped POST, PUT, PATCH, and DELETE response\
          \ reuse. Safe methods ignore it. Reuse requires configured trusted identity\
          \ and namespace; changed input returns 409. Business effects require durable\
          \ application idempotency."
        required: false
        schema:
          type: string
      responses:
        "200":
          description: Agreement retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonalLoanDetailDTO"
        "404":
          description: Agreement not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonalLoanDetailDTO"
    put:
      tags:
      - Personal Loans
      summary: Update Personal Loan Agreement
      description: Updates an existing personal loan agreement.
      operationId: updateAgreement
      parameters:
      - name: agreementId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: X-Idempotency-Key
        in: header
        description: "Optional retry key for scoped POST, PUT, PATCH, and DELETE response\
          \ reuse. Safe methods ignore it. Reuse requires configured trusted identity\
          \ and namespace; changed input returns 409. Business effects require durable\
          \ application idempotency."
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePersonalLoanCommand"
        required: true
      responses:
        "200":
          description: Agreement updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonalLoanDetailDTO"
        "404":
          description: Agreement not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonalLoanDetailDTO"
