  /api/v1/experience/lending/applications/{id}/documents/actions/{actionId}/recovery:
    post:
      tags:
      - Lending - Application Documents
      summary: Recover original evidence custody and its application association
      description: "May complete a missing association under current authority. Never\
        \ uploads replacement bytes, generates another action or deletes retained\
        \ Document custody."
      operationId: recoverApplicationDocumentEvidence
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: actionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "201":
          description: Original missing association completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationDocumentDTO"
        "200":
          description: Existing original association/content observed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationDocumentDTO"
        "400":
          description: Invalid original application/action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationDocumentDTO"
        "401":
          description: Bearer authentication refused
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationDocumentDTO"
        "403":
          description: Current original signed-party authority refused
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationDocumentDTO"
        "409":
          description: Original action conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationEvidenceError"
        "503":
          description: Known partial progress or uncertain completion preserved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationEvidenceError"
      security:
      - lendingExperienceIntakeBearer: []
      x-disable-idempotency: true
  /api/v1/experience/lending/applications/{id}/documents:
    get:
      tags:
      - Lending - Application Documents
      summary: List Documents
      description: Returns all documents attached to a loan application.
      operationId: listDocuments
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: X-Idempotency-Key
        in: header
        description: "Optional retry key for scoped POST, PUT, PATCH, and DELETE response\
