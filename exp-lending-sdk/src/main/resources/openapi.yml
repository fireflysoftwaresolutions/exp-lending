          type: number
        applicationId:
          type: string
          format: uuid
        servicingCaseId:
          type: string
          format: uuid
        purposeDescription:
          type: string
        insuranceType:
          type: string
        insurancePremiumRate:
          type: number
        earlyRepaymentPenaltyType:
          type: string
        earlyRepaymentPenaltyRate:
          type: number
        isUnsecured:
          type: boolean
        guarantorRequired:
          type: boolean
        coolingOffPeriodDays:
          type: integer
          format: int32
        originationFeeRate:
          type: number
        originationFeeAmount:
          type: number
        agreementSignedDate:
          type: string
          format: date
        agreementEffectiveDate:
          type: string
          format: date
    UpdateApplicationPartyCommand:
      type: object
      properties:
        role:
          type: string
    ApplicationPartyDTO:
      type: object
      properties:
        partyId:
          type: string
          format: uuid
        applicationId:
          type: string
          format: uuid
        role:
          type: string
        fullName:
          type: string
        identificationNumber:
          type: string
        addedAt:
          type: string
          format: date-time
    ConfigureDisbursementAccountCommand:
      type: object
      properties:
        accountId:
          type: string
          format: uuid
        accountType:
          type: string
    DisbursementAccountDTO:
      type: object
      properties:
        accountId:
          type: string
          format: uuid
        iban:
          type: string
        bankName:
          type: string
        accountType:
          type: string
        default:
          type: boolean
    ConfigureSimulationCommand:
      required:
      - productType
      - requestedAmount
      - term
      type: object
      properties:
        productType:
          minLength: 1
          pattern: ^(PERSONAL_LOAN|LEASING)$
          type: string
        productId:
          type: string
          format: uuid
        requestedAmount:
          minimum: 0
          exclusiveMinimum: true
          type: number
        term:
          minimum: 1
          type: integer
          format: int32
        purpose:
          type: string
        sector:
          type: string
        assetType:
          type: string
    ConfiguredSimulationDTO:
      type: object
      properties:
        simulationId:
          type: string
          format: uuid
        productType:
          type: string
        productId:
          type: string
          format: uuid
        requestedAmount:
          type: number
        term:
          type: integer
          format: int32
        monthlyPayment:
          type: number
        tin:
          type: number
        tae:
          type: number
        totalAmount:
          type: number
        currency:
          type: string
    CircuitBreakerInfo:
      type: object
      properties:
        state:
          type: string
        name:
          type: string
        failureRate:
          type: number
          format: double
        failureRateThreshold:
          type: number
          format: double
        failureCount:
          type: integer
          format: int32
        nextAttemptTime:
          type: integer
          format: int64
        fallbackSuggestion:
          type: string
    ErrorResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
          format: int32
        error:
          type: string
        message:
          type: string
        code:
          type: string
        path:
          type: string
        traceId:
          type: string
        spanId:
          type: string
        correlationId:
          type: string
        requestId:
          type: string
        details:
          type: string
        suggestion:
          type: string
        documentation:
          type: string
        helpUrl:
          type: string
        instance:
          type: string
        category:
          type: string
          enum:
          - VALIDATION
          - BUSINESS
          - TECHNICAL
          - SECURITY
          - EXTERNAL
          - RESOURCE
          - RATE_LIMIT
          - CIRCUIT_BREAKER
          - UNKNOWN
        severity:
          type: string
          enum:
          - LOW
          - MEDIUM
          - HIGH
          - CRITICAL
        retryable:
          type: boolean
        rateLimitInfo:
          $ref: "#/components/schemas/RateLimitInfo"
        circuitBreakerInfo:
          $ref: "#/components/schemas/CircuitBreakerInfo"
        metadata:
          type: object
          additionalProperties:
            type: object
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ValidationError"
        stackTrace:
          type: string
        debugInfo:
          type: object
          additionalProperties:
            type: object
        retry_after:
