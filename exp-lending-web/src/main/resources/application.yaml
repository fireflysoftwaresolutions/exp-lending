spring:
  application:
    name: exp-lending
  codec:
    max-in-memory-size: 20MB
  threads:
    virtual:
      enabled: true
  # ---- DEMO ONLY: Redis disabled (no spring.data.redis is set, but the autoconfig still
  # tries localhost:6379 if the classes are on the classpath). Restore when Redis is reachable.
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisReactiveAutoConfiguration

firefly:
  openapi:
    instant-scalar:
      enabled: true
  cache:
    enabled: true
    redis:
      enabled: false
    default-cache-type: POSTGRES
    postgres:
      enabled: true
      host: ${CACHE_DB_HOST:localhost}
      port: ${CACHE_DB_PORT:5432}
      database: ${CACHE_DB_NAME:}
      username: ${CACHE_DB_USERNAME:}
      password: ${CACHE_DB_PASSWORD:}
      ssl-mode: ${CACHE_DB_SSL_MODE:verify-full}
      schema: ${CACHE_DB_SCHEMA:firefly_lending_experience_cache}
      cache-table: cache_entries
      auto-create-schema: false
      min-pool-size: 1
      max-pool-size: 2
      connect-timeout: 5s
      acquire-timeout: 5s
      initialization-timeout: 15s
      shutdown-timeout: 5s
  experience:
    payments:
      adapter: hub

server:
  port: ${SERVER_PORT:8102}
  shutdown: graceful
api-configuration:
  domain-platform:
    lending-loan-origination:
      base-path: ${ENDPOINT_DOMAIN_LENDING_LOAN_ORIGINATION:http://localhost:8082}
    lending-loan-servicing:
      base-path: ${ENDPOINT_DOMAIN_LENDING_LOAN_SERVICING:http://localhost:8084}
    lending-credit-scoring:
      base-path: ${ENDPOINT_DOMAIN_LENDING_CREDIT_SCORING:http://localhost:8042}
    lending-asset-finance:
      base-path: ${ENDPOINT_DOMAIN_LENDING_ASSET_FINANCE:http://localhost:8043}
    lending-delinquency-collections:
      base-path: ${ENDPOINT_DOMAIN_LENDING_DELINQUENCY_COLLECTIONS:http://localhost:8048}
    lending-personal-loans:
      base-path: ${ENDPOINT_DOMAIN_LENDING_PERSONAL_LOANS:http://localhost:8044}
    lending-mortgage:
      base-path: ${ENDPOINT_DOMAIN_LENDING_MORTGAGE:http://localhost:8045}
    lending-supply-chain-finance:
      base-path: ${ENDPOINT_DOMAIN_LENDING_SUPPLY_CHAIN_FINANCE:http://localhost:8046}
    product-pricing:
      base-path: ${ENDPOINT_DOMAIN_PRODUCT_PRICING:http://localhost:8086}
    pricing-engine:
      base-path: ${ENDPOINT_DOMAIN_CORE_PRICING_ENGINE:http://localhost:8088}
      timeout: 5s
    common-contracts:
      base-path: ${ENDPOINT_DOMAIN_COMMON_CONTRACTS:http://localhost:8090}
    common-sca:
      base-path: ${ENDPOINT_DOMAIN_COMMON_SCA:http://localhost:8041}
    common-notifications:
      base-path: ${ENDPOINT_DOMAIN_COMMON_NOTIFICATIONS:http://localhost:8095}
    payments:
      base-path: ${ENDPOINT_DOMAIN_PAYMENTS:http://localhost:8092}
springdoc:
  packages-to-scan: io.fireflysoftware.experience.lending.web.controllers
  paths-to-match: /api/**
  swagger-ui:
    path: /swagger-ui.html
    tagsSorter: alpha
    operationsSorter: method
    docExpansion: none
    filter: true
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
logging:
  level:
    root: INFO
    io.fireflysoftware.experience.lending: DEBUG

---
spring:
  config:
    activate:
      on-profile: dev
logging:
  level:
    io.fireflysoftware: DEBUG

---
spring:
  config:
    activate:
      on-profile: pro
logging:
  level:
    io.fireflysoftware: INFO
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
